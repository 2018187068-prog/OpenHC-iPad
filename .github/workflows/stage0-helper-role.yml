name: Stage 0 helper role metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-tool:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic endpoints and zero application bytes
        run: |
          set -euo pipefail
          mkdir -p artifacts/helper-role
          python3 scripts/test-role-binary-audit.py 2>&1 | tee artifacts/helper-role/audit-tests.log
          python3 scripts/test-btstack-transport-metadata.py 2>&1 | tee artifacts/helper-role/transport-metadata-tests.log
          python3 scripts/test-showcase-role.py 2>&1 | tee artifacts/helper-role/tests.log
      - name: Build standalone iOS 15 arm64 metadata tool
        run: |
          set -euo pipefail
          brew install ldid
          # Baseline retains the old link format. A separately named legacy
          # fixup variant is a diagnostic candidate, not a proven SIGKILL fix.
          for variant in baseline legacy-fixups; do
            output=artifacts/helper-role/showcase-role-probe-$variant
            options=(-std=c11 -Wall -Wextra -Werror)
            if [ "$variant" = legacy-fixups ]; then options+=(-Wl,-no_fixup_chains); fi
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 \
              "${options[@]}" scripts/showcase-role-probe.c -o "$output"
            ldid -S "$output"
            bash scripts/verify-device-binary.sh "$output" | tee "$output.compatibility.log"
            otool -l "$output" > "$output.load-commands.log"
            otool -L "$output" | tee "$output.dependencies.log"
            ldid -h "$output" 2>&1 | tee "$output.signature.log"
            python3 scripts/audit-role-binary.py "$output" | tee "$output.audit.json"
            shasum -a 256 "$output" | tee "$output.sha256.txt"
          done
          # /private/var staging and /private/preboot rootless execution gave
          # different physical results with identical bytes. Ship the verified
          # rootless layout; packaging never installs or executes on a device.
          python3 scripts/package-role-probe.py \
            artifacts/helper-role/showcase-role-probe-baseline artifacts/helper-role
          {
            echo "source_commit=$GITHUB_SHA"
            xcodebuild -version
            xcrun --sdk iphoneos clang --version
            xcrun --sdk iphoneos --show-sdk-version
            brew list --versions ldid
          } > artifacts/helper-role/BUILD.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-role-${{ github.sha }}
          path: artifacts/helper-role/
          if-no-files-found: error
