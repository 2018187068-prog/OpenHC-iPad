name: Stage 0 iOS bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/**'
      - 'native/**'
      - 'theos/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/stage0-ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host SSH client dependency for guarded driver tests
        run: python -m pip install 'paramiko==5.1.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test bounded BTstack query and service clients with synthetic local server
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          python3 scripts/test-fe35-bridge-config.py 2>&1 | tee artifacts/logs/fe35-bridge-config-tests.log
          python3 scripts/test-btstack-probe.py 2>&1 | tee artifacts/logs/btstack-mock-tests.log
          python3 scripts/test-btstack-transport-socket.py 2>&1 | tee artifacts/logs/btstack-transport-socket-tests.log
          python3 scripts/test-btstack-session-gate.py 2>&1 | tee artifacts/logs/btstack-session-gate-tests.log
          python3 scripts/test-btstack-transport-runner.py 2>&1 | tee artifacts/logs/btstack-transport-runner-tests.log
          python3 scripts/test-btstack-transport-metadata.py 2>&1 | tee artifacts/logs/btstack-transport-metadata-tests.log
          python3 scripts/test-capture-btstack-session-evidence.py 2>&1 | tee artifacts/logs/session-evidence-capture-tests.log
          python3 scripts/test-session-owner-probe.py 2>&1 | tee artifacts/logs/session-owner-probe-tests.log
          python3 scripts/test-btstack-power.py 2>&1 | tee artifacts/logs/btstack-power-trial-tests.log
      - name: Build candidate static crypto backend
        shell: bash
        run: bash scripts/build-crypto-backend.sh
      - name: Build static iOS framework
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          shasum -a 256 -c scripts/source-slices.sha256 | tee artifacts/logs/source-slices.log
          python3 scripts/verify-speke-oracle.py | tee artifacts/logs/speke-oracle.log
          gradle :bridge:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace 2>&1 | tee artifacts/logs/kotlin-native-build.log
          mkdir -p artifacts/iosArm64
          header=bridge/build/bin/iosArm64/releaseFramework/OpenHCBridge.framework/Headers/OpenHCBridge.h
          grep -q '@interface OHCBFe35ControlBridge' "$header"
          grep -q '@interface OHCBFe35ControlBridgeEvent' "$header"
          grep -q 'startNowMillis:' "$header"
          grep -q 'feedData:' "$header"
          grep -q 'listenerReadyChannel:' "$header"
          grep -q 'tickNowMillis:' "$header"
          grep -q 'close' "$header"
          grep -q '@interface OHCBScanReceiverSession' "$header"
          grep -q '@interface OHCBScanReceiverConfig' "$header"
          grep -q '@interface OHCBScanReceiverEvent' "$header"
          grep -q 'onControlRfcommReadyGeneration:' "$header"
          grep -q 'onControlSdpReadyGeneration:' "$header"
          grep -q 'onTransportEventGeneration:' "$header"
          grep -q 'takeAuthHandoffGeneration:' "$header"
          cp "$header" artifacts/iosArm64/OpenHCBridge-ObjC-API.h
          cp -R bridge/build/bin/iosArm64/releaseFramework/OpenHCBridge.framework artifacts/iosArm64/
          bash scripts/verify-apple-artifact.sh artifacts/iosArm64/OpenHCBridge.framework 2>&1 | tee artifacts/logs/framework-inspection.log
          {
            echo "source_commit=$GITHUB_SHA"
            echo "kotlin=2.1.20"
            echo "gradle=8.13"
            xcodebuild -version
            xcodebuild -showsdks
            java -version 2>&1
            gradle --version
          } | tee artifacts/BUILD.txt
      - name: Run FE35 CLI against a synthetic BTdaemon peer in iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          gradle :bridge:linkReleaseFrameworkIosSimulatorArm64 --no-daemon --stacktrace 2>&1 | tee artifacts/logs/ios-simulator-framework.log
          bash scripts/test-fe35-cli-smoke-simulator.sh 2>&1 | tee artifacts/logs/fe35-cli-simulator-smoke.log
      - name: Run shared JVM and Native simulator tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          gradle :bridge:jvmTest :bridge:iosSimulatorArm64Test --no-daemon --stacktrace 2>&1 | tee artifacts/logs/shared-tests.log
      - name: Collect test reports
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          if [ -d bridge/build/test-results ]; then cp -R bridge/build/test-results/. artifacts/test-results/; fi
      - name: Install Theos and ldid
        if: always()
        shell: bash
        run: |
          brew install ldid dpkg
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Validate demo archive writer before either demo package build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          python3 scripts/test-scan-demo-archive.py 2>&1 | tee artifacts/logs/scan-demo-archive-tests.log
          python3 scripts/test-scan-demo-archive.py --native-writer scripts/scan-demo-dpkg-deb.sh 2>&1 | tee artifacts/logs/scan-demo-native-writer.log
      - name: Build rootless Theos package
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd theos
          mkdir -p layout/usr/share/doc/com.gcbond.openhc-bridge-check
          cp ../artifacts/licenses/OpenSSL-LICENSE.txt layout/usr/share/doc/com.gcbond.openhc-bridge-check/
          cp ../docs/OpenHC-LICENSE.txt layout/usr/share/doc/com.gcbond.openhc-bridge-check/
          make package FINALPACKAGE=1 THEOS="$THEOS" TARGET_CODESIGN=ldid TARGET_CODESIGN_FLAGS=-S 2>&1 | tee ../artifacts/logs/theos-package.log
          mkdir -p ../artifacts/deb
          cp packages/*.deb ../artifacts/deb/
          dpkg-deb -c packages/*.deb | tee ../artifacts/logs/deb-layout.log
          dpkg-deb -f packages/*.deb Package Version Architecture Depends | tee ../artifacts/logs/deb-control.log
          mkdir ../artifacts/extracted-deb
          dpkg-deb -x packages/*.deb ../artifacts/extracted-deb
          binary=../artifacts/extracted-deb/var/jb/usr/bin/openhc-bridge-check
          test -f "$binary"
          file "$binary" | tee ../artifacts/logs/theos-binary.txt
          lipo "$binary" -verify_arch arm64
          otool -L "$binary" | tee ../artifacts/logs/theos-link-dependencies.log
          if grep -q 'OpenHCBridge' ../artifacts/logs/theos-link-dependencies.log; then
            echo 'OpenHCBridge was dynamically linked instead of statically linked' >&2
            exit 1
          fi
          if grep -Ei 'libcrypto|libssl' ../artifacts/logs/theos-link-dependencies.log; then
            echo 'Crypto backend must be statically linked' >&2
            exit 1
          fi
          nm "$binary" | grep '_oh_crypto' > ../artifacts/logs/crypto-linked-symbol.log
          otool -l "$binary" | tee ../artifacts/logs/theos-load-commands.log
          ldid -h "$binary" 2>&1 | tee ../artifacts/logs/ldid-signature-inspection.log
          grep -q 'CodeDirectory' ../artifacts/logs/ldid-signature-inspection.log
          brew info ldid | tee ../artifacts/logs/ldid-version.txt
          grep -q 'var/jb/usr/bin/openhc-bridge-check' ../artifacts/logs/deb-layout.log
          grep -q 'iphoneos-arm64' ../artifacts/logs/deb-control.log
          bash ../scripts/verify-device-binary.sh "$binary"
      - name: Validate UIKit scan demo and rootless application package
        if: always()
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-scan-ui.sh 2>&1 | tee artifacts/logs/scan-ui-check.log
      - name: Validate independent scan helper and package
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          bash scripts/check-scan-supervisor-helper.sh 2>&1 | tee artifacts/logs/scan-supervisor-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openhc-ipad-stage0-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
